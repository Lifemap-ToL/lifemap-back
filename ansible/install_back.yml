---
- name: Base lifemap-back install
  hosts: lifemap-back, lifemap-dev

  tasks:
      ### --- DIRECTORIES CREATION ---

      - name: Create www/static directory
        become: true
        ansible.builtin.file:
            path: "{{ static_root_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0775"

      - name: Create ~/back directory
        ansible.builtin.file:
            path: "{{ docker_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0775"

      - name: Create results directory
        ansible.builtin.file:
            path: "{{ build_results_dir }}"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0755"

      - name: Create ncbi front directory
        ansible.builtin.file:
            path: "{{ front_root_dir }}/ncbi"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0775"

      - name: Create bbox front directory
        ansible.builtin.file:
            path: "{{ front_root_dir }}/bbox"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0775"

      - name: Create bbox data directory
        become: true
        ansible.builtin.file:
            path: "{{ docker_dir }}/bbox/data"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0755"

      - name: Create solr data directory
        become: true
        ansible.builtin.file:
            path: "{{ docker_dir }}/solr/data"
            state: directory
            owner: "{{ ansible_user }}"
            mode: "0755"

      ### --- CONTAINERS INSTALLATION ---

      - name: Copy env to docker-compose directory
        ansible.builtin.template:
            src: templates/env.j2
            dest: "{{ docker_dir }}/.env"
            mode: "0600"
            force: true

      - name: Copy env to home directory
        ansible.builtin.template:
            src: templates/env.j2
            dest: "/home/{{ ansible_user }}/.env"
            mode: "0600"
            force: true

      - name: Check if docker-compose.yml already exists
        ansible.builtin.stat:
            path: "{{ docker_dir }}/docker-compose.yml"
        register: docker_compose

      - name: Stop containers if needed
        become: true
        ansible.builtin.command:
            chdir: "{{ docker_dir }}"
            cmd: docker compose -f docker-compose.yml down
        changed_when: true
        when: docker_compose.stat.exists

      - name: Rsync docker files
        ansible.posix.synchronize:
            src: "../back/"
            dest: "{{ docker_dir }}"
            rsync_opts:
                - "--exclude=*.j2"

      - name: Copy docker Caddy config
        become: true
        ansible.builtin.template:
            src: templates/caddy/Caddyfile.j2
            dest: "{{ docker_dir }}/caddy/Caddyfile"
            mode: preserve
            force: true

      - name: Copy datasource-settings to style directory
        become: true
        ansible.builtin.template:
            src: ../back/mod_tile_deepzoom/datasource-settings.xml.inc.j2
            dest: "{{ docker_dir }}/mod_tile_deepzoom/style/inc/datasource-settings.xml.inc"
            mode: preserve
            force: true

      - name: Copy bbox.toml to bbox docker directory
        become: true
        ansible.builtin.template:
            src: templates/bbox/bbox.toml.j2
            dest: "{{ docker_dir }}/bbox/bbox.toml"
            mode: preserve
            force: true

      - name: Build and launch containers
        become: true
        ansible.builtin.command:
            chdir: "{{ docker_dir }}"
            cmd: docker compose -f docker-compose.yml up -d --build --pull always
        changed_when: true

      - name: Copy solr security.json
        become: true
        ansible.builtin.copy:
            dest: "{{ docker_dir }}/solr/data/"
            src: "assets/solr/security.json"
            force: true
            mode: preserve

      - name: Change solr data ownership
        ansible.builtin.command:
            cmd: docker exec -u root lifemap-solr chown -R solr:solr /var/solr/data/

      - name: Restart Solr
        become: true
        ansible.builtin.command:
            chdir: "{{ docker_dir }}"
            cmd: docker compose -f docker-compose.yml restart solr
        changed_when: true

      - name: Wait for Solr to be up
        ansible.builtin.uri:
            url: "http://localhost:8983/solr/"
            status_code: 200
            validate_certs: false
        register: solr_main_page
        until: solr_main_page.status == 200
        retries: 20
        delay: 5

      - name: Check solr password
        ansible.builtin.uri:
            url: "http://localhost:8983/solr/admin/authentication"
            method: POST
            user: "solr"
            password: "SolrRocks"
            validate_certs: false
            force_basic_auth: true
            status_code: [200, 401]
            headers:
                Content-Type: "application/json"
            body_format: json
            body: "{}"
        register: login_result

      - name: Change solr password
        ansible.builtin.uri:
            url: "http://localhost:8983/solr/admin/authentication"
            method: POST
            user: "solr"
            password: "SolrRocks"
            validate_certs: false
            force_basic_auth: true
            headers:
                Content-Type: "application/json"
            body_format: json
            body: '{"set-user": {"solr": "{{ solr_password }}"} }'
        when: login_result.status == 200

      - name: Check if Solr taxo core already exists
        ansible.builtin.stat:
            path: "{{ docker_dir }}/solr/data/taxo/conf"
        register: taxo_core

      - name: Check if Solr addi core already exists
        ansible.builtin.stat:
            path: "{{ docker_dir }}/solr/data/addi/conf"
        register: addi_core

      - name: Create Solr taxo core
        become: true
        ansible.builtin.command:
            cmd: docker exec lifemap-solr solr create -c taxo -n data_driven_schema_configs
        changed_when: true
        when: not taxo_core.stat.exists

      - name: Create Solr addi core
        become: true
        ansible.builtin.command:
            cmd: docker exec lifemap-solr solr create -c addi -n data_driven_schema_configs
        changed_when: true
        when: not addi_core.stat.exists

      - name: Stop Solr
        become: true
        ansible.builtin.command:
            chdir: "{{ docker_dir }}"
            cmd: docker compose -f docker-compose.yml stop solr
        changed_when: true

      - name: Copy schema.xml to Solr taxo core
        become: true
        ansible.builtin.copy:
            dest: "{{ docker_dir }}/solr/data/taxo/conf"
            src: "assets/solr/taxo/schema.xml"
            force: true
            mode: preserve

      - name: Copy solrconfig.xml to Solr taxo core
        become: true
        ansible.builtin.copy:
            dest: "{{ docker_dir }}/solr/data/taxo/conf"
            src: "assets/solr/taxo/solrconfig.xml"
            force: true
            mode: preserve

      - name: Start Solr
        become: true
        ansible.builtin.command:
            chdir: "{{ docker_dir }}"
            cmd: docker compose -f docker-compose.yml start solr
        changed_when: true
