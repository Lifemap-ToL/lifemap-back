[project]
name = "lifemap-builder"
version = "0.1.0"
description = "Lifemap backend data builder"
readme = "README.md"
requires-python = ">= 3.13"
authors = [
  { name = "Damien de Vienne", email = "damien.de-vienne@univ-lyon1.fr" }
]
dependencies = [
  "ete4>=4.4.0",
  "numpy>=1.26.4",
  "polars>=1.37.1",
  "psycopg[binary]>=3.1.19",
  "python-dotenv>=1.0.1",
  "requests>=2.33.0",
  "six>=1.16.0",
  "tqdm>=4.66.4",
]

[dependency-groups]
dev = [
  "ruff>=0.15.9",
  "ty>=0.0.29",
]

[tool.ty.environment]
root = ["./tree"]

[tool.uv]
package = false
